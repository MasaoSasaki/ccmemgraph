<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccmemgraph</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --hairline: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --age-0: #86b6ef; --age-1: #5598e7; --age-2: #2a78d6; --age-3: #1c5cab; --age-4: #0d366b;
    --ring-cut: #d03b3b; --ring-unindexed: #fab219; --ring-missing: #898781;
    --link: #c3c2b7; --link-hi: #52514e;
    --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fde3e3; --err-ink: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --hairline: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --age-0: #184f95; --age-1: #256abf; --age-2: #3987e5; --age-3: #6da7ec; --age-4: #b7d3f6;
      --link: #383835; --link-hi: #c3c2b7;
      --warn-bg: #3a2a0a; --warn-ink: #ffd27a; --err-bg: #3a1212; --err-ink: #ffb3b3;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --hairline: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --age-0: #184f95; --age-1: #256abf; --age-2: #3987e5; --age-3: #6da7ec; --age-4: #b7d3f6;
    --link: #383835; --link-hi: #c3c2b7;
    --warn-bg: #3a2a0a; --warn-ink: #ffd27a; --err-bg: #3a1212; --err-ink: #ffb3b3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink-1); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); font-size: 13px; color: var(--ink-2); }
  .states { display: flex; flex-wrap: wrap; gap: 6px 16px; font-variant-numeric: tabular-nums; }
  .states span { display: inline-flex; align-items: center; gap: 6px; }
  .states b { color: var(--ink-1); font-weight: 600; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .sw.cut { box-shadow: 0 0 0 2.5px var(--ring-cut); width: 9px; height: 9px; margin: 0 2px; }
  .sw.unindexed { box-shadow: 0 0 0 2.5px var(--ring-unindexed); width: 9px; height: 9px; margin: 0 2px; }
  .sw.missing { background: transparent; border: 1.5px dashed var(--ring-missing); }
  .spacer { flex: 1; }
  button, select { font: inherit; font-size: 13px; color: var(--ink-1); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink-1); color: var(--page); }
  .layout { flex: 1; display: flex; min-height: 420px; }
  aside { width: 260px; flex: none; overflow: auto; border-right: 1px solid var(--hairline); background: var(--page); padding: 8px 0; }
  aside button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; border-radius: 0; background: transparent; padding: 6px 16px; text-align: left; color: var(--ink-2); }
  aside button:hover { background: var(--surface); }
  aside button[aria-current="true"] { background: var(--surface); color: var(--ink-1); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink-1); }
  aside .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .cnt { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 12px; }
  aside .bad { font-variant-numeric: tabular-nums; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); }
  aside h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 10px 16px 4px; }
  main { flex: 1; position: relative; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; background: var(--surface); cursor: grab; touch-action: none; }
  svg:active { cursor: grabbing; }
  .link { stroke: var(--link); stroke-width: 1px; fill: none; }
  .node circle { stroke: var(--surface); stroke-width: 2px; cursor: pointer; }
  .node.cut circle { stroke: var(--ring-cut); stroke-width: 3px; }
  .node.unindexed circle { stroke: var(--ring-unindexed); stroke-width: 3px; }
  .node.missing circle { fill: transparent; stroke: var(--ring-missing); stroke-dasharray: 3 2; stroke-width: 1.5px; }
  .label { font-size: 11px; fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .cluster { font-size: 12px; font-weight: 600; fill: var(--ink-muted); pointer-events: none; letter-spacing: .02em; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .dim { opacity: 0.12 !important; }
  .legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
  .legend .row { display: flex; gap: 10px; align-items: center; }
  .legend .ramp { display: inline-flex; gap: 2px; align-items: center; }
  .legend .ramp i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; }
  .tip b { font-weight: 600; }
  .tip .m { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tip .d { margin-top: 4px; color: var(--ink-2); }
  .panel { display: none; padding: 16px; overflow: auto; background: var(--surface); position: absolute; inset: 0; }
  .panel h2 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; }
  .panel h2:first-child { margin-top: 0; }
  .panel p.note { color: var(--ink-2); font-size: 13px; margin: 4px 0 10px; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  summary .kind { margin-left: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; }
  th.sortable[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .sw { vertical-align: middle; margin-right: 6px; }
  .kind { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; background: var(--warn-bg); color: var(--warn-ink); }
  .kind.error { background: var(--err-bg); color: var(--err-ink); }
  .kind.info { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
  .hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--ink-muted); pointer-events: none; }
  .mt { color: var(--ink-muted); font-size: 11px; }
  @media (max-width: 700px) { .layout { flex-direction: column; } aside { width: auto; max-height: 160px; border-right: 0; border-bottom: 1px solid var(--hairline); } .legend { display: none; } }
</style>
</head>
<body>
<header>
  <h1>ccmemgraph</h1>
  <p class="sub">Claude Code auto memory under <code id="root"></code><span id="root-note"></span>. Nodes are memory files, colour is age (deeper = older), a ring marks what the next session will not see in <code>MEMORY.md</code>, size is in-links. Generated <span id="gen"></span>. <span id="cc"></span></p>
</header>
<div class="bar">
  <div class="states" id="states" aria-label="memory states"></div>
  <div class="spacer"></div>
  <button id="btn-issues" aria-pressed="false">Checks</button>
  <button id="btn-table" aria-pressed="false">Table</button>
</div>
<div class="layout">
<aside id="side" aria-label="projects"></aside>
<main>
  <svg id="g" role="img" aria-label="memory files and the links between them"></svg>
  <div class="legend" id="legend"></div>
  <div class="tip" id="tip"></div>
  <div class="hint">drag to move · wheel to zoom · hover for details</div>
  <div id="issues" class="panel"></div>
  <div id="table" class="panel"></div>
</main>
</div>
<script>__D3__</script>
<script>
const DATA = __DATA__;
const L = DATA.limits;
const STATE = {
  visible:   { label: "Visible",   help: "listed within the MEMORY.md load window; the next session sees it at start" },
  cut:       { label: "Cut",       help: `listed in MEMORY.md but beyond the load window (${L.index_lines} lines / ${L.index_chars.toLocaleString()} chars); not seen at start` },
  unindexed: { label: "Unindexed", help: "not listed in MEMORY.md; only memory recall can surface it" },
  missing:   { label: "Missing",   help: "referenced by the index or a [[link]] but no file exists" },
};
const KIND = {
  "index-over-limit": "MEMORY.md over the load window", "index-near-limit": "MEMORY.md near the load window", "index-cut": "Listed beyond the load window",
  "unindexed": "Not in MEMORY.md", "index-missing": "MEMORY.md points to a missing file", "file-over-limit": `File longer than ${L.file_chars.toLocaleString()} chars`,
  "recall-out": `Outside the recall scan (newest ${L.recall_scan_files})`, "dangling-link": "Broken [[link]]", "link-mismatch": "[[link]] spelled differently from name",
  "duplicate-identical": "Same file in several projects (identical)", "duplicate-differs": "Same file name in related projects (differs)",
  "type-invalid": "type missing or not one of user / feedback / project / reference", "unparsable": "Frontmatter could not be read", "other-store": "Mentions another project's directory (estimate)",
};
const AGE = [[7, "≤ 7 d"], [30, "≤ 30 d"], [90, "≤ 90 d"], [180, "≤ 180 d"], [Infinity, "older"]];
const ageStep = d => d.age_days == null ? null : AGE.findIndex(([max]) => d.age_days <= max);
const color = d => d.state === "missing" ? "transparent" : `var(--age-${ageStep(d)})`;
const swatch = (d, cls = "") => `<i class="sw ${d.state} ${cls}" style="${d.state === "missing" ? "" : "background:" + color(d)}"></i>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmtAge = d => d.age_days == null ? "" : `${Math.round(d.age_days)} d · ${new Date(d.modified_ms).toISOString().slice(0, 10)}${d.modified_from === "mtime" ? ' <span class="mt">(mtime)</span>' : ""}`;
const typeLabel = t => t || "(none)";

document.getElementById("gen").textContent = DATA.generated;
const CC = DATA.claude_code;
const ccNote = CC.running && CC.running !== CC.measured
  ? `Limits are those of Claude Code ${CC.measured}; this machine runs ${CC.running}, on which they have not been re-verified.`
  : `Limits are those of Claude Code ${CC.measured}.`;
document.getElementById("cc").textContent = ccNote;
document.getElementById("root").textContent = DATA.root.replace(DATA.home, "~");
if (DATA.root_missing) document.getElementById("root-note").textContent = " (this directory does not exist; nothing was scanned)";

const svg = d3.select("#g"), main = document.querySelector("main"), tip = document.getElementById("tip");
let W = main.clientWidth, H = main.clientHeight, sim = null, current = "";
svg.attr("viewBox", [0, 0, W, H]);
svg.append("defs").append("marker").attr("id", "arrow").attr("viewBox", "0 -4 8 8").attr("refX", 8).attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
  .append("path").attr("d", "M0,-3L8,0L0,3").attr("fill", "var(--link)");
const root = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.3, 6]).on("zoom", e => root.attr("transform", e.transform));
svg.call(zoom);

// legend: state colours, type shapes, age fading
document.getElementById("legend").innerHTML =
  `<div class="row">age <span class="ramp">${AGE.map((_, i) => `<i style="background:var(--age-${i})"></i>`).join("")}</span> ${AGE[0][1]} → ${AGE[AGE.length - 1][1]}</div>` +
  Object.entries(STATE).filter(([k]) => k !== "visible").map(([k, v]) => `<div class="row" title="${esc(v.help)}"><i class="sw ${k}" style="${k === "missing" ? "" : "background:var(--age-2)"}"></i>${v.label}</div>`).join("");

function render(project) {
  current = project;
  if (sim) sim.stop();
  root.selectAll("*").remove();
  const nodes = DATA.nodes.filter(d => !project || d.project === project).map(d => ({...d}));
  const ids = new Set(nodes.map(d => d.id));
  const links = DATA.links.filter(l => ids.has(l.source) && ids.has(l.target)).map(l => ({...l}));
  const maxIn = d3.max(nodes, d => d.indeg) || 1;
  const r = d3.scaleSqrt().domain([0, maxIn]).range([3.5, 24]);   // area, not radius, tracks the count
  const counts = Object.fromEntries(Object.keys(STATE).map(s => [s, nodes.filter(d => d.state === s).length]));
  document.getElementById("states").innerHTML = Object.entries(STATE).map(([k, v]) =>
    `<span title="${esc(v.help)}"><i class="sw ${k}" style="${k === "missing" ? "" : "background:var(--age-2)"}"></i>${v.label} <b>${counts[k]}</b></span>`).join("") +
    `<span>files <b>${nodes.filter(d => d.state !== "missing").length}</b></span><span>links <b>${links.length}</b></span>`;

  const linkSel = root.append("g").selectAll("line").data(links).join("line").attr("class", "link").attr("marker-end", "url(#arrow)");
  const nodeSel = root.append("g").selectAll("g").data(nodes).join("g").attr("class", d => "node " + d.state);
  nodeSel.append("circle").attr("r", d => r(d.indeg)).attr("fill", color);
  const clusters = project ? [] : d3.groups(nodes, d => d.label).filter(([, v]) => v.length >= 3);
  const clusterSel = root.append("g").selectAll("text").data(clusters).join("text").attr("class", "cluster").attr("text-anchor", "middle").text(([k]) => k);
  const labelled = nodes.filter(d => d.indeg >= 3).sort((a, b) => b.indeg - a.indeg).slice(0, 16);  // the hubs, without crowding the page
  const labelSel = root.append("g").selectAll("text").data(labelled).join("text").attr("class", "label").attr("dx", d => r(d.indeg) + 4).attr("dy", "0.35em").text(d => d.name);

  const nbr = new Map(nodes.map(d => [d.id, new Set([d.id])]));
  links.forEach(l => { nbr.get(l.source).add(l.target); nbr.get(l.target).add(l.source); });
  const edgeEnd = l => { const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y, len = Math.hypot(dx, dy) || 1, k = (len - r(l.target.indeg) - 2) / len; return { x: l.source.x + dx * k, y: l.source.y + dy * k }; };

  // all-projects view: one packed circle per project so clusters stay apart and labels have room
  const anchors = new Map();
  if (!project && clusters.length) {
    const circles = d3.groups(nodes, d => d.label).map(([k, v]) => ({ k, r: Math.sqrt(v.length) * 9 + 30 }));  // slack for the title above each cluster
    d3.packSiblings(circles);
    circles.forEach(c => anchors.set(c.k, c));
  }
  const ax = d => anchors.get(d.label)?.x ?? 0, ay = d => anchors.get(d.label)?.y ?? 0;
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => 30 + r(l.target.indeg)).strength(0.6))
    .force("charge", d3.forceManyBody().strength(anchors.size ? -10 : -40))
    .force("collide", d3.forceCollide(d => r(d.indeg) + 2.5))
    .force("x", d3.forceX(ax).strength(anchors.size ? 0.3 : 0.1))
    .force("y", d3.forceY(ay).strength(anchors.size ? 0.3 : 0.1))
    .on("tick", () => {
      linkSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => edgeEnd(d).x).attr("y2", d => edgeEnd(d).y);
      nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
      labelSel.attr("x", d => d.x).attr("y", d => d.y);
      clusterSel.attr("x", ([k, v]) => anchors.get(k)?.x ?? d3.median(v, d => d.x)).attr("y", ([, v]) => d3.min(v, d => d.y - r(d.indeg)) - 10);
    });
  // settle before the first paint, then fit the whole graph into the viewport
  sim.stop(); sim.tick(300); sim.alpha(0.2).restart();
  hideOverlappingLabels(labelSel, clusterSel);
  if (nodes.length) {
    const [x0, x1] = d3.extent(nodes, d => d.x), [y0, y1] = d3.extent(nodes, d => d.y);
    const pad = 60, k = Math.min(W / (x1 - x0 + pad * 2), H / (y1 - y0 + pad * 2), 1.5);
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k));
  }

  nodeSel.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  nodeSel.on("mouseenter", (e, d) => {
      const n = nbr.get(d.id);
      nodeSel.classed("dim", o => !n.has(o.id)); labelSel.classed("dim", o => !n.has(o.id));
      linkSel.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id).style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "var(--link-hi)" : null);
      tip.innerHTML = `<b>${esc(d.name)}</b><div class="m">${esc(typeLabel(d.type))} · ${esc(d.label)}${d.file ? " · " + esc(d.file) : ""}</div>` +
        `<div class="m">${STATE[d.state].label}${d.index_line ? ` (MEMORY.md line ${d.index_line})` : ""}${d.recall_out ? " · outside recall scan" : ""}</div>` +
        (d.age_days != null ? `<div class="m">age ${fmtAge(d)} (${AGE[ageStep(d)][1]}) · ${d.chars.toLocaleString()} chars</div>` : "") +
        `<div class="m">in-links ${d.indeg} · out-links ${d.outdeg}</div>${d.desc ? `<div class="d">${esc(d.desc)}</div>` : ""}`;
      tip.style.display = "block";
    })
    .on("mousemove", e => { const b = main.getBoundingClientRect(); tip.style.left = (e.clientX - b.left + 14) + "px"; tip.style.top = (e.clientY - b.top + 14) + "px"; })
    .on("mouseleave", () => { nodeSel.classed("dim", false); labelSel.classed("dim", false); linkSel.classed("dim", false).style("stroke", null); tip.style.display = "none"; });

  renderTable(nodes);
  renderIssues(project);
}

// greedy label thinning: a label that would sit on top of an already kept label (or a cluster title) is hidden
function hideOverlappingLabels(labelSel, clusterSel) {
  const boxes = [];
  const box = (x, y, text, size, anchorMiddle) => { const w = text.length * size * 0.6, h = size * 1.3; return { x0: anchorMiddle ? x - w / 2 : x, x1: anchorMiddle ? x + w / 2 : x + w, y0: y - h / 2, y1: y + h / 2 }; };
  const hits = b => boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
  clusterSel.each(function (d) { boxes.push(box(+this.getAttribute("x"), +this.getAttribute("y"), this.textContent, 12, true)); });
  labelSel.style("display", null).each(function (d) {
    const b = box(d.x + +this.getAttribute("dx"), d.y, d.name, 11, false);
    if (hits(b)) this.style.display = "none"; else boxes.push(b);
  });
}

// the same nodes as a sortable table
let sortKey = "indeg", sortDir = -1;
function renderTable(nodes) {
  const cols = [["name", "name"], ["type", "type"], ["state", "state"], ["age_days", "age (modified)"], ["chars", "chars"], ["indeg", "in-links"], ["label", "project"], ["file", "file"]];
  const rows = [...nodes].sort((a, b) => { const x = a[sortKey], y = b[sortKey]; const c = (x == null) - (y == null) || (typeof x === "number" ? x - y : String(x).localeCompare(String(y))); return c * sortDir || a.name.localeCompare(b.name); });
  document.getElementById("table").innerHTML = `<table><thead><tr>` + cols.map(([k, t]) => `<th class="sortable" data-key="${k}" aria-sort="${k === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none"}">${t}</th>`).join("") + `</tr></thead><tbody>` +
    rows.map(d => `<tr><td>${swatch(d)}${esc(d.name)}</td><td>${esc(typeLabel(d.type))}</td><td>${STATE[d.state].label}</td><td class="n">${fmtAge(d)}</td><td class="n">${d.chars ? d.chars.toLocaleString() : ""}</td><td class="n">${d.indeg}</td><td>${esc(d.label)}</td><td><code>${esc(d.file)}</code></td></tr>`).join("") + `</tbody></table>`;
  document.getElementById("table").querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key; sortDir = k === sortKey ? -sortDir : (k === "name" || k === "label" || k === "file" || k === "type" || k === "state" ? 1 : -1); sortKey = k; renderTable(nodes);
  }));
}

// structural checks, grouped by kind, plus one row per project
function renderIssues(project) {
  const issues = DATA.issues.filter(i => !project || i.project === project);
  const projects = DATA.projects.filter(p => !project || p.project === project);
  const byKind = d3.groups(issues, i => i.kind).sort((a, b) => b[1].length - a[1].length);
  const sev = { error: 0, warning: 1, info: 2 };
  byKind.sort((a, b) => sev[a[1][0].severity] - sev[b[1][0].severity] || b[1].length - a[1].length);
  const label = p => DATA.projects.find(x => x.project === p)?.label ?? p;
  document.getElementById("btn-issues").textContent = `Checks (${issues.length})`;
  document.getElementById("issues").innerHTML =
    `<h2>Load window per project</h2><p class="note">What the next session loads from each MEMORY.md, computed from the files as they are now. ${esc(ccNote)} ${L.index_lines} lines / ${L.index_chars.toLocaleString()} chars for the index, ${L.file_chars.toLocaleString()} chars shown per recalled file, recall scans the newest ${L.recall_scan_files} files.</p>` +
    `<table><thead><tr><th>project</th><th>files</th><th>visible</th><th>cut</th><th>unindexed</th><th>missing</th><th>MEMORY.md lines</th><th>MEMORY.md chars</th><th>cut off</th><th>outside recall</th></tr></thead><tbody>` +
      projects.map(p => `<tr><td>${esc(p.label)}</td><td class="n">${p.files}</td><td class="n">${p.states.visible}</td><td class="n">${p.states.cut}</td><td class="n">${p.states.unindexed}</td><td class="n">${p.states.missing}</td>` +
        `<td class="n">${p.index_lines} <span class="mt">/ ${L.index_lines}</span></td><td class="n">${p.index_chars.toLocaleString()} <span class="mt">/ ${L.index_chars.toLocaleString()}</span></td>` +
        `<td class="n">${p.index_cut_lines ? `${p.index_cut_lines} from line ${p.index_cut_from}` : "—"}</td><td class="n">${p.recall_out || "—"}</td></tr>`).join("") + `</tbody></table>` +
    `<h2>Findings ${issues.length}</h2>` + (issues.length ? byKind.map(([kind, list]) =>
      `<details ${list[0].severity !== "info" ? "open" : ""}><summary>${esc(KIND[kind] ?? kind)} <span class="kind ${list[0].severity}">${list.length}</span></summary>` +
      `<table><thead><tr><th>project</th><th>file</th><th>line</th><th>detail</th></tr></thead><tbody>` +
      list.map(i => `<tr><td>${esc(label(i.project))}</td><td><code>${esc(i.file)}</code></td><td class="n">${i.line ?? ""}</td><td>${esc(i.message)}${i.evidence ? ` <span class="mt">${esc(i.evidence)}</span>` : ""}</td></tr>`).join("") + `</tbody></table></details>`).join("")
      : `<p class="note">No findings.</p>`);
}

const panels = { "btn-issues": "issues", "btn-table": "table" };
for (const [bid, pid] of Object.entries(panels)) {
  document.getElementById(bid).addEventListener("click", () => {
    const on = document.getElementById(bid).getAttribute("aria-pressed") !== "true";
    for (const [b, p] of Object.entries(panels)) { document.getElementById(b).setAttribute("aria-pressed", b === bid && on); document.getElementById(p).style.display = (b === bid && on) ? "block" : "none"; }
  });
}
new ResizeObserver(() => { W = main.clientWidth; H = main.clientHeight; svg.attr("viewBox", [0, 0, W, H]); }).observe(main);

// sidebar: all projects, then one entry per project with file count and finding badge
const side = document.getElementById("side");
const entries = [{ key: "", label: "All projects", files: DATA.nodes.filter(d => d.state !== "missing").length, issues: DATA.issues.length }]
  .concat(DATA.projects.map(p => ({ key: p.project, label: p.label, files: p.files, issues: p.issues })));
side.innerHTML = `<h3>View</h3>` + entries.map((e, i) => `<button data-key="${esc(e.key)}" aria-current="${i === 0}"><span class="name" title="${esc(e.label)}">${esc(e.label)}</span><span class="cnt">${e.files}</span>${e.issues ? `<span class="bad">${e.issues}</span>` : ""}</button>` + (i === 0 ? `<h3>Projects</h3>` : "")).join("");
side.addEventListener("click", e => {
  const b = e.target.closest("button[data-key]"); if (!b) return;
  side.querySelectorAll("button").forEach(x => x.setAttribute("aria-current", x === b));
  render(b.dataset.key);
});
render("");
</script>
</body>
</html>
