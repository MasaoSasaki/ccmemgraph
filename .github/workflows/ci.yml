name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/ccmemgraph/build.py --root fixtures/demo/projects --fs-root fixtures/demo/fs --home /home/demo --no-open --out out/demo.html
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python skills/ccmemgraph/build.py --root fixtures/demo/projects --fs-root fixtures/demo/fs --home /home/demo --no-open --out tests/render/out/demo.html
      - run: npm ci
        working-directory: tests/render
      - run: npx playwright install --with-deps chromium
        working-directory: tests/render
      - run: node check.mjs out/demo.html
        working-directory: tests/render
