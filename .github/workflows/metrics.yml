# Daily record of the repository's public figures (stars, forks, issues, traffic, releases, workflow health)
# appended to history.json on the `metrics` branch. The dashboard reads that file; nothing here touches main.
name: metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metrics
          path: metrics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record today
        env:
          # Traffic (views, clones) needs a token with push access; the workflow token has none and records null.
          # Add a fine-grained PAT as the METRICS_TOKEN secret to fill those two fields.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python .github/scripts/record_metrics.py "$GITHUB_REPOSITORY" metrics/history.json
      - name: Commit to the metrics branch
        working-directory: metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Record $(date -u +%F)"
          git push
